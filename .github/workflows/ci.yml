name: CI

# v1.1.9 (Section H): GitHub Actions CI for the BSA plugin family.
#
# Runs the same gates the operator's pre-commit checklist enforces locally:
#   * pytest (1412+ tests)
#   * scripts/fixture_runner.py --all
#   * scripts/privacy_scan.py
#   * scripts/compute_canon_hash.py (matches plugin.json)
#
# Triggers:
#   * push to main → full validation (pytest + fixture_runner + privacy + canon hash)
#   * pull_request → same (PR-style workflow even though the repo is solo
#     today; ready for future contributor opening)
#
# The repo has been local-only through v1.1.8. This workflow is the gating
# infrastructure for the next pilot engagement / external operator
# adoption — when the repo lands on GitHub, it has CI day-1.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual run from the Actions tab.
  workflow_dispatch:

# Cancel in-progress runs of the same workflow + ref pair when a new
# commit lands. Saves runner minutes during rapid-fire patch lines like
# the v1.1.x line did (8 releases in one session).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match the floor declared in scripts/* shebangs ("Python 3.9+").
        # 3.11 is the modern default; 3.12 is the latest we want to track
        # (3.13 had compatibility surprises with some stdlib changes;
        # add it once the repo passes against it locally first).
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          # -q for compact output; -ra to surface skipped/xfailed at the
          # bottom (helps when adding new tests that get skipped silently).
          python -m pytest -q -ra

  fixture-runner:
    name: fixture-runner --all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run fixture-runner against all golden fixtures
        run: |
          # The runner validates all 8 golden fixtures (3 happy-path + 5
          # adversarial including 1 spec_only) in --mode=validate. Failure
          # = drift between fixture data and current schemas.
          python3 scripts/fixture_runner.py --all --mode=validate

  privacy-scan:
    name: privacy_scan (no PII / secrets / blockers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run privacy scan (must produce 0 blockers)
        run: |
          # Stdlib-only; no install needed.
          python3 scripts/privacy_scan.py

  security-audit:
    name: security_audit (token-shape + insecure subprocess + dangerous builtins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run security audit (must produce 0 CRITICAL + 0 HIGH)
        run: |
          # Stdlib-only; no install needed. Section G v1.1.11 — drift
          # detection complementing privacy_scan.py. See SECURITY.md +
          # docs/threat_model.md for the full coverage matrix.
          python3 scripts/security_audit.py

  canon-hash:
    name: compute_canon_hash matches plugin.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify canon hash drift
        run: |
          # The pytest case test_manifest_canon_hash_matches_current_script_output
          # also enforces this, but having it as a standalone job makes
          # the failure mode obvious in the Actions UI ("hash drift" vs
          # "test failure"). Stdlib-only.
          declared=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['canonPolicyVersion']['hash_full'])")
          computed=$(python3 scripts/compute_canon_hash.py)
          if [ "$declared" != "$computed" ]; then
            echo "::error::canon hash drift detected"
            echo "  declared in plugin.json: $declared"
            echo "  computed by script:       $computed"
            echo "Run 'python3 scripts/compute_canon_hash.py' locally and update .claude-plugin/plugin.json canonPolicyVersion.hash_full."
            exit 1
          fi
          echo "OK: canon hash matches ($declared)"

  marker-chain:
    name: validate_marker_chain (per-fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate marker chains in every fixture
        run: |
          # Per-fixture marker-chain validation. Each fixture's
          # expected_markers/ must form a gapless, monotonic, hash-
          # consistent chain. Stdlib-only.
          fail=0
          for dir in fixtures/golden/*/expected_markers; do
            if [ -d "$dir" ]; then
              echo "--- $dir ---"
              python3 scripts/validate_marker_chain.py "$dir" || fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "::error::marker-chain validation failed for at least one fixture"
            exit 1
          fi

  perf-bench:
    name: perf_bench (no p95 regression > 2x baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run perf benchmarks + check against baseline
        run: |
          # Section F (v1.1.13). Baseline is recorded on the maintainer's
          # laptop (Apple Silicon, macOS); GitHub Actions Linux runners
          # are typically 1.5–3× slower per operation. The 2× regression
          # threshold accommodates this — see docs/perf_baseline.md for
          # the full regression policy.
          #
          # Stdlib-only. Total wall time ~6s on dev hardware, ~12s on CI.
          # If this job starts taking >60s, something has regressed
          # significantly and the --check should already have caught it.
          python3 scripts/perf_bench.py --check --quiet

  phase-7-lint:
    name: phase_7_lint (tunables.yaml ↔ source-of-truth + IMMUTABLE_CONFLICT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install yaml dependency
        run: |
          # phase_7_lint.py uses pyyaml (already in requirements-dev.txt
          # for tests/test_ci_workflows.py). Install it directly here so
          # the job stays self-contained and doesn't accidentally pull
          # in the full dev dependency chain.
          pip install pyyaml
      - name: Validate config/tunables.yaml
        run: |
          # Section D (v1.1.14). Catches drift between config/tunables.yaml
          # and the source-of-truth files (skill references, schemas, etc.)
          # that hold the tunable values. Hard-fails on:
          #   - C1 value drift (tunables.yaml says 0.85 but the source
          #     file now has 0.87)
          #   - C5 IMMUTABLE_CONFLICT (L1_auto_tunable that touches a
          #     governance/immutable_invariants.md INV-XX)
          #   - C6 L1 inside POLICY_GLOBS (would silently bump canon hash)
          # See docs/phase_7_design.md for the full 8-check contract.
          python3 scripts/phase_7_lint.py

  sidecar-registry-lint:
    name: sidecar_registry_lint (registry ↔ skill dirs + base schema conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install yaml dependency
        run: pip install pyyaml
      - name: Validate config/sidecar_registry.yaml
        run: |
          # v1.1.18 (S2). Catches drift between config/sidecar_registry.yaml
          # and reality. Hard-fails on:
          #   - C1 missing skill directory
          #   - C3 anchor schema doesn't conform to base shape
          #   - C4 f5_path_prefix contains a POLICY_GLOBS entry
          #     (sidecar paths must stay non-canonical)
          # See config/sidecar_registry.yaml header for the full 7-check
          # contract.
          python3 scripts/sidecar_registry_lint.py
